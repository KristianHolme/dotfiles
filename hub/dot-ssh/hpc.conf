# Hub (abacus-as) ssh config for 2FA hosts, included from ~/.ssh/config.
# Home is shared NFS, so sockets live on local disk (/run/user/UID).
# Masters are opened by bin/dotfiles-hub-login.sh; everything else reuses them
# and fails fast (BatchMode) when no master exists.

Host uio
    HostName login.math.uio.no
    User kholme
    AddressFamily inet

Host saga betzy olivia
    HostName %h.sigma2.no
    User kholme
    setEnv TERM=xterm-256color
    StrictHostKeyChecking accept-new

# The hub reaches the ml nodes directly (no jump). Password auth until the hub
# key is in the shared ml home; then ml needs no master.
Host ml1 ml2 ml3 ml4 ml6 ml7
    HostName %h.hpc.uio.no
    User kholme
    setEnv TERM=xterm-256color

Host saga betzy olivia ml1 ml2 ml3 ml4 ml6 ml7
    ControlMaster no
    ControlPath /run/user/%i/cm-%C
    ControlPersist 24h
    BatchMode yes
    ConnectTimeout 15
    ServerAliveInterval 30
    ServerAliveCountMax 6
